<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Vinculacion por codigo QR</title>
  <desc id="desc">Dos telefonos: el supervisado muestra un codigo QR con su identificador y el supervisor lo escanea con CameraX y ML Kit. Seis pasos del proceso de vinculacion.</desc>

  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1017"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="cam3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12251a"/>
      <stop offset="100%" stop-color="#0b1410"/>
    </linearGradient>
    <linearGradient id="scan3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E7D32" stop-opacity="0"/>
      <stop offset="50%" stop-color="#66bb6a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2E7D32" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
