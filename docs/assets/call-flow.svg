<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de una videollamada de emergencia</title>
  <desc id="desc">Diagrama de secuencia entre el telefono supervisado, el servidor de senalizacion y el telefono supervisor: llamada, aceptacion, oferta y respuesta SDP, candidatos ICE y medios WebRTC punto a punto.</desc>

  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1017"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="aRed2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D32F2F"/>
    </marker>
    <marker id="aGold2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F9A825"/>
    </marker>
    <marker id="aGreen2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D32"/>
    </marker>
    <filter id="glow2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="940" fill="url(#bg2)"/>
  <g stroke="#1b2431" stroke-width="1" opacity="0.35">
    <path d="M0 120 H1200 M0 240 H1200 M0 360 H1200 M0 480 H1200 M0 600 H1200 M0 720 H1200 M0 840 H1200"/>
  </g>

  <text x="60" y="58" fill="#E6E6E6" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700">Flujo de una llamada de emergencia</text>
  <text x="60" y="86" fill="#8b949e" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15">Senalizacion por WebSocket · negociacion SDP · ICE trickle · medios directos</text>
  <line x1="60" y1="104" x2="1140" y2="104" stroke="#21262d"/>

  <!-- actor boxes -->
  <rect x="80" y="132" width="300" height="78" rx="12" fill="#2a1213" stroke="#D32F2F" stroke-width="2" filter="url(#glow2)"/>
  <text x="230" y="164" text-anchor="middle" fill="#ffb4b4" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Supervisado</text>
  <text x="230" y="188" text-anchor="middle" fill="#b98a8a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">boton SOS · auto-respuesta</text>

  <rect x="470" y="132" width="300" height="78" rx="12" fill="#0f1c2c" stroke="#1565C0" stroke-width="2" filter="url(#glow2)"/>
  <text x="620" y="164" text-anchor="middle" fill="#9ecbff" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Servidor de senalizacion</text>
  <text x="620" y="188" text-anchor="middle" fill="#7d97b3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Node.js + ws · :3000</text>

  <rect x="860" y="132" width="300" height="78" rx="12" fill="#10241a" stroke="#2E7D32" stroke-width="2" filter="url(#glow2)"/>
  <text x="1010" y="164" text-anchor="middle" fill="#a5d6b0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Supervisor</text>
  <text x="1010" y="188" text-anchor="middle" fill="#7fa88b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">overlay Aceptar / Rechazar</text>

  <!-- lifelines -->
  <line x1="230" y1="210" x2="230" y2="800" stroke="#3a1f20" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="620" y1="210" x2="620" y2="800" stroke="#25303d" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="1010" y1="210" x2="1010" y2="800" stroke="#1f3528" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- messages -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5">
    <line x1="230" y1="246" x2="614" y2="246" stroke="#58a6ff" stroke-width="2" marker-end="url(#a2)"/>
    <text x="422" y="239" text-anchor="middle" fill="#9ecbff">1. call { fromName }</text>

    <line x1="620" y1="286" x2="1004" y2="286" stroke="#58a6ff" stroke-width="2" marker-end="url(#a2)"/>
    <text x="812" y="279" text-anchor="middle" fill="#9ecbff">2. call (destino en linea)</text>

    <line x1="620" y1="326" x2="1004" y2="326" stroke="#F9A825" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aGold2)"/>
    <text x="812" y="319" text-anchor="middle" fill="#e0b655">2b. FCM si esta offline (data-only)</text>

    <line x1="1010" y1="366" x2="626" y2="366" stroke="#2E7D32" stroke-width="2" marker-end="url(#aGreen2)"/>
    <text x="818" y="359" text-anchor="middle" fill="#a5d6b0">3. call-accepted</text>

    <line x1="620" y1="406" x2="236" y2="406" stroke="#2E7D32" stroke-width="2" marker-end="url(#aGreen2)"/>
    <text x="428" y="399" text-anchor="middle" fill="#a5d6b0">4. call-accepted (se inicia WebRTC)</text>

    <line x1="230" y1="446" x2="614" y2="446" stroke="#58a6ff" stroke-width="2" marker-end="url(#a2)"/>
    <text x="422" y="439" text-anchor="middle" fill="#9ecbff">5. offer { sdp }</text>

    <line x1="620" y1="486" x2="1004" y2="486" stroke="#58a6ff" stroke-width="2" marker-end="url(#a2)"/>
    <text x="812" y="479" text-anchor="middle" fill="#9ecbff">6. offer</text>

    <line x1="1010" y1="526" x2="626" y2="526" stroke="#2E7D32" stroke-width="2" marker-end="url(#aGreen2)"/>
    <text x="818" y="519" text-anchor="middle" fill="#a5d6b0">7. answer { sdp }</text>

    <line x1="620" y1="566" x2="236" y2="566" stroke="#2E7D32" stroke-width="2" marker-end="url(#aGreen2)"/>
    <text x="428" y="559" text-anchor="middle" fill="#a5d6b0">8. answer</text>

    <line x1="230" y1="606" x2="614" y2="606" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a2)"/>
    <text x="422" y="599" text-anchor="middle" fill="#a9b7c6">9. ice-candidate (trickle)</text>

    <line x1="1010" y1="646" x2="626" y2="646" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a2)"/>
    <text x="818" y="639" text-anchor="middle" fill="#a9b7c6">10. ice-candidate (trickle)</text>

    <line x1="620" y1="686" x2="236" y2="686" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a2)"/>
    <text x="428" y="679" text-anchor="middle" fill="#a9b7c6">11. ice-candidate</text>

    <line x1="1010" y1="726" x2="626" y2="726" stroke="#D32F2F" stroke-width="2" marker-end="url(#aRed2)"/>
    <text x="818" y="719" text-anchor="middle" fill="#ffb4b4">12. end-call</text>

    <line x1="620" y1="766" x2="236" y2="766" stroke="#D32F2F" stroke-width="2" marker-end="url(#aRed2)"/>
    <text x="428" y="759" text-anchor="middle" fill="#ffb4b4">13. end-call · cleanupCall()</text>
  </g>

  <!-- state badges -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
    <rect x="40" y="238" width="76" height="18" rx="9" fill="#1a0f10" stroke="#D32F2F" stroke-width="1"/>
    <text x="78" y="251" text-anchor="middle" fill="#ffb4b4">DIALING</text>
    <rect x="40" y="358" width="76" height="18" rx="9" fill="#1a0f10" stroke="#D32F2F" stroke-width="1"/>
    <text x="78" y="371" text-anchor="middle" fill="#ffb4b4">RINGING</text>
    <rect x="40" y="438" width="94" height="18" rx="9" fill="#1a0f10" stroke="#D32F2F" stroke-width="1"/>
    <text x="87" y="451" text-anchor="middle" fill="#ffb4b4">CONNECTING</text>
    <rect x="40" y="678" width="76" height="18" rx="9" fill="#10241a" stroke="#2E7D32" stroke-width="1"/>
    <text x="78" y="691" text-anchor="middle" fill="#a5d6b0">ACTIVE</text>
  </g>

  <!-- media band -->
  <rect x="120" y="820" width="960" height="72" rx="12" fill="#1a0f10" stroke="#D32F2F" stroke-width="1.5"/>
  <line x1="170" y1="850" x2="1030" y2="850" stroke="#D32F2F" stroke-width="5" marker-end="url(#aRed2)"/>
  <text x="600" y="844" text-anchor="middle" fill="#ffb4b4" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">SRTP audio + video · 1280x720 @ 30 fps · directo entre telefonos</text>
  <text x="600" y="870" text-anchor="middle" fill="#9e7b7b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">ICE CONNECTED en ambos lados · el servidor solo reenvia JSON de sesion</text>

  <text x="1140" y="922" text-anchor="end" fill="#4b5563" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Alerta Mayor · v1.3.0</text>
</svg>
